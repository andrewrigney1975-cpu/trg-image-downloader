<!DOCTYPE html>
<html>
  <head>
    <title>Image Downloader</title>

    <link rel="stylesheet" href="/stylesheets/main.css" type="text/css" />
    <link rel="stylesheet" href="/lib/nouislider.min.css" type="text/css" />
    <style>
      html,
      body {
        overflow-y: scroll;
        height: 100%;
        margin: 0;
      }

      main {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      body.suppress_ui {
        min-width: 0;
        min-height: 0;
        width: 1px;
        height: 1px;
        overflow: hidden;
      }

      .grid {
        width: 100%;
        border-collapse: collapse;
        margin: 4px 0;
      }

      .grid td {
        padding: 2px;
      }
      .grid td:first-child {
        padding-left: 0;
      }
      .grid td:last-child {
        padding-right: 0;
      }
      .grid td input[type='text'],
      .grid td input[type='button'],
      .grid td input[type='number'],
      .grid td select {
        width: 100%;
      }

      #filters_container,
      #downloads_container {
        z-index: 1;
        position: sticky;
        box-shadow: var(--elevation-1);
        background: var(--surface);
        padding: 12px;
      }

      #filters_container {
        top: 0;
        border-bottom: 1px solid var(--border-color);
        padding-bottom: 8px;
      }

      #toggle_advanced_filters_button,
      #open_options_button {
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        width: 30px;
        height: 30px;

        border-radius: var(--border-radius-md);
        border: 0;
        margin-bottom: 4px;
        background: var(--input-background);
      }

      #toggle_advanced_filters_button .toggle {
        height: 20px;

        transition: var(--transition-transform);
      }

      #toggle_advanced_filters_button.collapsed .toggle {
        transform: rotate(-135deg);
      }

      #open_options_button img {
        height: 18px;
      }

      .icon-button {
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        width: 30px;
        height: 30px;

        border-radius: var(--border-radius-md);
        border: 0;

        transition: var(--transition-background);
      }

      .icon-button img,
      .icon-button svg {
        height: 16px;
      }

      .icon-button.danger {
        background: var(--danger);
        color: var(--foreground-inverse);
      }

      .icon-button.danger:hover,
      .icon-button.danger:focus,
      .icon-button.danger:active {
        background: var(--danger-light);
      }

      .download_queue_empty_alert {
        display: flex;
        align-items: center;
        justify-content: center;
        flex: 1;
        height: 30px;
        padding: 0 12px;
        border-radius: var(--border-radius-md);
        font-weight: bold;
        text-align: center;
      }

      .noUi-state-drag {
        cursor: grabbing;
      }

      .noUi-horizontal {
        height: 12px;
      }

      .noUi-target {
        border-color: var(--accent);
        transition: var(--transition-border-color);
      }

      .noUi-target[disabled] {
        border-color: var(--border-color);
      }

      .noUi-connects {
        cursor: pointer;
      }

      .noUi-connect {
        background: var(--accent);
        transition: var(--transition-background);
      }

      .noUi-target[disabled] .noUi-connect {
        background: var(--input-background);
      }

      .noUi-horizontal .noUi-origin .noUi-handle {
        cursor: grab;
        top: -5px;
        right: -9px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border-color: var(--accent);

        transition: var(--transition-border-color);
      }

      .noUi-horizontal .noUi-origin[disabled] .noUi-handle {
        cursor: help;
        border-color: var(--border-color);
      }

      .noUi-handle::before,
      .noUi-handle::after {
        top: 3px;
        height: 10px;
      }

      .noUi-handle::before {
        left: 6px;
      }

      .noUi-handle::after {
        left: 9px;
      }

      @media (prefers-color-scheme: dark) {
        .noUi-target {
          background: var(--surface-alt);
          box-shadow: none;
        }

        .noUi-handle {
          background: var(--surface);
          border-color: var(--neutral-transparent-20);
          box-shadow: none;
        }

        .noUi-handle::before,
        .noUi-handle::after {
          background: var(--neutral-transparent-20);
        }

        .noUi-tooltip {
          background: var(--surface);
          border-color: var(--neutral-transparent-20);
          color: var(--foreground);
        }
      }

      #only_images_from_links_container {
        padding: 1px;
      }

      #images_container {
        flex: 1;

        display: grid;
        align-content: baseline;
        gap: var(--images-container-gap);
        padding: var(--images-container-padding);
        padding-top: 9px; /* Account for checkbox 3px margin */
        background: var(--surface-alt);
      }

      #images_container .select_all_row {
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      #images_container .select_all_checkbox {
        font-weight: bold;
      }

      #images_container .download_progress {
        color: var(--foreground-light);
        white-space: nowrap;
      }

      #images_container .card {
        cursor: pointer;
        overflow: hidden;
        position: relative;

        display: grid;
        grid-template-rows: 1fr auto;
        justify-items: center;
        align-items: center;

        box-shadow: var(--elevation-1);
        border-radius: var(--border-radius-sm);
        border: 2px solid transparent;
        background: var(--surface);

        transition: var(--transition-border-color), var(--transition-box-shadow);
      }

      #images_container .card:hover {
        box-shadow: var(--elevation-2);
      }

      #images_container .card.checked {
        border-color: var(--accent);
      }

      #images_container img {
        background: var(--image-background); /* Useful for transparent images */
      }

      #images_container .checkbox,
      #images_container .image_url_container,
      #images_container .actions {
        position: absolute;

        transition: var(--transition-opacity);
        opacity: 0;
      }

      #images_container .card.checked .checkbox,
      #images_container .card:hover .checkbox,
      #images_container .card:hover .image_url_container,
      #images_container .card:hover .actions {
        opacity: 1;
      }

      #images_container .checkbox {
        top: 4px;
        left: 4px;
      }

      #images_container .actions {
        top: 4px;
        right: 4px;
      }

      #images_container .actions button {
        cursor: pointer;
        border-radius: var(--border-radius-md);
        border: 2px solid var(--neutral);
        background-position: center;
        background-repeat: no-repeat;
        background-size: 24px;
        padding: 15px;

        transition: var(--transition-background);
        background-color: var(--surface);
      }

      #images_container .actions button:hover {
        background-color: var(--surface-alt);
      }

      #images_container .image_url_container {
        right: 4px;
        bottom: 4px;
        left: 4px;
      }

      /* checkbox */
      #images_container .checkbox {
        width: 34px;
        height: 34px;

        border-radius: var(--border-radius-md);
        border: 2px solid var(--neutral);
        background: var(--surface);

        transition: var(--transition-background), var(--transition-border-color),
          var(--transition-opacity);
      }

      #images_container .card.checked .checkbox {
        background: var(--accent);
        border-color: var(--accent);
      }

      #images_container .checkbox::after {
        position: absolute;
        top: calc(50% - 9px);
        left: calc(50% - 9px);
        width: 18px;
        height: 12px;
        content: '';
        transform: rotate(-45deg);
        border: 4px solid var(--neutral-lightest);
        border-top: 0;
        border-right: 0;

        transition: var(--transition-border-color), var(--transition-opacity);
      }

      #images_container .card:hover .checkbox::after {
        border-color: var(--neutral-light);
      }

      #images_container .card.checked .checkbox::after {
        border-color: var(--neutral-lightest);
      }
      /* checkbox */

      /* actions */
      #images_container .actions {
        display: flex;
        gap: 4px;
      }
      /* actions */

      /* image_url_container */
      #images_container .image_url_container {
        background: var(--surface-alt);
      }

      #images_container .image_url_container input[type='text'] {
        width: 100%;
        margin-bottom: 0;
      }
      /* image_url_container */

      #downloads_container {
        bottom: 0;
        display: grid;
        gap: 4px;
        border-top: 1px solid var(--border-color);
      }
    </style>
  </head>

  <body>
    <main></main>

    <script src="/lib/jquery-3.5.1.min.js"></script>
    <script src="/lib/nouislider.min.js"></script>

    <script src="/src/defaults.js"></script>
    <script type="module" src="/src/Popup/Popup.js"></script>
  </body>
</html>
