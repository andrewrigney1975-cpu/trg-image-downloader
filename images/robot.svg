<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 24 24"
  width="48px"
  height="48px"
>
  <style>
    .robot-body {
      fill: #b0aeb3;
    }
    .robot-face {
      fill: #ffffff;
    }
    .robot-eye {
      fill: #2277dd;
    }
    @media (prefers-color-scheme: dark) {
      .robot-body {
        fill: #4d4b52;
      }
      .robot-face {
        fill: #232025;
      }
      .robot-eye {
        fill: #4da3f5;
      }
    }
  </style>

  <circle class="robot-body" cx="12" cy="2.4" r="1.2" />
  <rect class="robot-body" x="11.4" y="3.4" width="1.2" height="2.4" />

  <rect class="robot-body" x="1" y="10" width="2.2" height="4.4" rx="1.1" />
  <rect class="robot-body" x="20.8" y="10" width="2.2" height="4.4" rx="1.1" />

  <rect class="robot-body" x="3" y="6" width="18" height="15.5" rx="3.5" />
  <rect class="robot-face" x="5.2" y="8.2" width="13.6" height="10.6" rx="2.4" />

  <circle class="robot-eye" cx="9.6" cy="13" r="1.7" />
  <circle class="robot-eye" cx="14.4" cy="13" r="1.7" />

  <rect class="robot-body" x="9" y="16.3" width="6" height="1.3" rx="0.65" />
</svg>
